<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finalizar Compra - Catálogo e Pagamento</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="checkout-container">
        <h2>Finalizar Pedido</h2>

        <!-- 1º: CATÁLOGO / RESUMO DO PRODUTO -->
        <div class="product-summary">
            <h3>1. Produto Selecionado</h3>
            <h4 id="product-name">Produto Exemplo</h4>
            <p id="product-price">R$ 99,00</p>
        </div>

        <form id="checkout-form">
            <!-- 2º: ENDEREÇO (CEP primeiro para puxar a API automaticamente) -->
            <div class="address-section">
                <h3>2. Endereço de Entrega</h3>
                
                <div class="form-group">
                    <label for="cep">CEP</label>
                    <input type="text" id="cep" placeholder="00000-000" required>
                </div>

                <div class="form-group">
                    <label for="endereco">Endereço (Rua, Número e Bairro)</label>
                    <input type="text" id="endereco" placeholder="Ex: Rua das Flores, 123" required>
                </div>

                <div class="form-group">
                    <label for="cidade">Cidade / Estado</label>
                    <input type="text" id="cidade" placeholder="Ex: Guaratinguetá - SP" required>
                </div>
            </div>

            <!-- Dados Pessoais do Cliente (Nome e CPF) -->
            <div class="personal-section">
                <h3>Dados Pessoais</h3>
                <div class="form-group">
                    <label for="nome">Nome Completo</label>
                    <input type="text" id="nome" placeholder="Digite seu nome completo" required>
                </div>

                <div class="form-group">
                    <label for="cpf">CPF</label>
                    <input type="text" id="cpf" placeholder="000.000.000-00" required>
                </div>
            </div>

            <!-- 3º: PAGAMENTO (Botão final de ir para o pagamento) -->
            <button type="submit" class="btn-pay">3. Ir para o Pagamento</button>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
